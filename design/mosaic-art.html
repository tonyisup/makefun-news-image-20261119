<!doctype html>
<!--
  Direction D4, "mosaic with drawings": as D (same 30 stories, same words), but the ten
  biggest stories' cells are led by a drawing of the event (design/art.js). Was D, every story of 19 November 2026 gets one cell whose
  picture is a large pictogram or its key figure (51–48, −1,101, 109–0 ...), then a short
  bold label and one line of detail. Lead across the top with the three flags. Cells run in
  order of consequence; colour gives the region. No map, no stat band.
  Content: design/stories.js. Render: ./render.sh design/mosaic-art.html <out.png>
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>19 November 2026 - mosaic</title>
<script src="stories.js"></script>
<script src="icons.js"></script>
<script src="art.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; }
  body { background: #ece8de; color: #15181d; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; padding: 16px 18px 0; }
  header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 7px; border-bottom: 4px solid #15181d; }
  .kick { font-size: 13.5px; font-weight: 700; letter-spacing: 2.5px; color: #555b63; margin-bottom: 3px; }
  .date { font-size: 50px; font-weight: 800; letter-spacing: -1.1px; line-height: 1; }
  .key { display: grid; grid-template-columns: repeat(3, auto); gap: 3px 12px; font-size: 12.5px; font-weight: 700; color: #3d434b; }
  .key span::before { content: ''; display: inline-block; width: 10px; height: 10px; background: var(--c); margin-right: 5px; }
  .lead { display: flex; gap: 16px; align-items: center; margin-top: 8px; background: #fff; border-left: 9px solid var(--c); padding: 7px 14px; height: 118px; }
  .lead svg { flex: 0 0 120px; }
  .lead .place, .cell .place { font-weight: 800; text-transform: uppercase; color: var(--c); }
  .lead .place { font-size: 12.5px; letter-spacing: 1.4px; }
  .lead h1 { font-size: 30px; line-height: 1.05; letter-spacing: -0.5px; margin: 2px 0 4px; }
  .lead p { font-size: 14.5px; line-height: 1.24; color: #3d434b; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 145px; gap: 7px; margin-top: 7px; }
  .cell { background: #fff; border-top: 5px solid var(--c); padding: 6px 8px 6px; overflow: hidden; display: flex; flex-direction: column; }
  .pic { height: 44px; display: flex; align-items: center; justify-content: space-between; }
  .fig { font-size: 33px; font-weight: 800; letter-spacing: -1px; color: var(--c); line-height: 1; white-space: nowrap; }
  .fig.long { font-size: 27px; }
  .cell .place { font-size: 10px; letter-spacing: 0.8px; text-align: right; line-height: 1.1; max-width: 70px; }
  .cell h2 { font-size: 14.5px; line-height: 1.12; font-weight: 800; letter-spacing: -0.15px; margin-top: 5px; }
  .cell p { font-size: 11.5px; line-height: 1.2; color: #474d55; margin-top: 3px; }
  .note { background: #15181d; color: #e9e6de; border-top-color: #15181d; }
  .note h2 { color: #fff; font-size: 13px; letter-spacing: 1px; margin-top: 0; }
  .note p { color: #d0d3d8; font-size: 11px; }
  footer { position: absolute; left: 18px; right: 18px; bottom: 6px; font-size: 11px; white-space: nowrap; color: #555b63; }
  footer b { color: #15181d; }
</style>
</head>
<body>
<header>
  <div><div class="kick">THE WORLD’S NEWS IN 30 PICTURES</div><div class="date" id="date"></div></div>
  <div class="key" id="key"></div>
</header>
<section class="lead" id="lead"></section>
<section class="grid" id="grid"></section>
<footer><b>Each story checked against two or more outlets</b>: Reuters, AP, BBC, The Guardian, DW, CNN, Al Jazeera, Washington Post, Yonhap, The Hindu, Kyodo and others.</footer>
<script>
  const R = window.REGIONS;
  document.getElementById('date').textContent = window.DAY;
  document.getElementById('key').innerHTML = ['eu', 'me', 'as', 'af', 'am', 'gl'].map((r) => `<span style="--c:${R[r].color}">${R[r].name}</span>`).join('');
  const L = window.LEAD;
  const lead = document.getElementById('lead');
  lead.style.setProperty('--c', R[L.region].color);
  // The lead's picture: three flags on poles, US, China, Russia, behind one table.
  const flags = `<svg width="120" height="100" viewBox="0 0 168 150" aria-hidden="true">
    <rect x="4" y="18" width="4" height="128" fill="#555"/><g transform="translate(8,20)"><rect width="46" height="32" fill="#fff"/>
      <rect width="46" height="4.6" fill="#b22234"/><rect y="9.2" width="46" height="4.6" fill="#b22234"/><rect y="18.4" width="46" height="4.6" fill="#b22234"/><rect y="27.4" width="46" height="4.6" fill="#b22234"/><rect width="20" height="17" fill="#3c3b6e"/></g>
    <rect x="60" y="6" width="4" height="140" fill="#555"/><g transform="translate(64,8)"><rect width="46" height="32" fill="#de2910"/>
      <polygon points="9,4 10.8,9.4 16.5,9.4 11.9,12.7 13.7,18 9,14.8 4.3,18 6.1,12.7 1.5,9.4 7.2,9.4" fill="#ffde00"/></g>
    <rect x="116" y="18" width="4" height="128" fill="#555"/><g transform="translate(120,20)"><rect width="46" height="32" fill="#fff" stroke="#ccc" stroke-width="0.6"/>
      <rect y="10.7" width="46" height="10.7" fill="#0039a6"/><rect y="21.4" width="46" height="10.6" fill="#d52b1e"/></g>
    <rect x="0" y="118" width="168" height="10" rx="3" fill="#15181d"/></svg>`;
  lead.innerHTML = `${flags}<div><div class="place">${L.place}</div><h1>${L.head}</h1><p>${L.detail}</p></div>`;
  const sorted = [...window.STORIES.filter((s) => !s.extra)].sort((a, b) => a.rank - b.rank);
  const cells = sorted.map((s) => {
    const c = R[s.region].color;
    const pic = s.art ? window.art(s.art, 44) : s.fig ? `<span class="fig${s.fig.length > 4 ? ' long' : ''}">${s.fig}</span>` : window.icon(s.icon, 42, c);
    return `<div class="cell" style="--c:${c}"><div class="pic">${pic}<span class="place">${s.place}</span></div><h2>${s.short}</h2><p>${s.detail}</p></div>`;
  });
  cells.push(`<div class="cell note"><h2>DATE CHECK</h2><p>${window.NOT_THIS_DAY}</p></div>`);
  document.getElementById('grid').innerHTML = cells.join('');
</script>
</body>
</html>
